# TEMPLATE — rendered by render-models into ~/.omp/agent/config.yml: modelRoles.* = the catalog's
# brain ("<server>/<id>"), context.maxTokens = its context window.
modelRoles:
  default: ""
  slow: ""
symbolPreset: unicode
theme:
  dark: pearl
setupVersion: 1
# Context management — prevent hanging at large contexts.
# summarizeAt is static: if the brain context is below ~100000, lower it
# to roughly 75% of that here as well.
context:
  maxTokens: 0
  summarizeAt: 90000
  summaryTokens: 8000
