# LiteLLM proxy config — STATIC. Every model name passes through to the reasoning-normalizer, which
# resolves aliases (brain/vision/opus/sonnet/haiku, or any catalog model id) against
# config/models/models.yml and forwards to the right server. That is why adding servers/models or
# changing roles in the model-config wizard needs no litellm restart. Details:
# ideas/done/model-catalog.md. hosted_vllm/ keeps the OpenAI-compatible translation LiteLLM
# uses for vLLM (chat/completions, images as image_url). Nothing calls litellm's own /v1/models and
# check_provider_endpoint stays off, so v1.92.0's slow wildcard expansion there does not apply.
model_list:
  - model_name: "*"
    litellm_params:
      model: "hosted_vllm/*"
      api_base: "os.environ/LITELLM_UPSTREAM"
      api_key: dummy

litellm_settings:
  drop_params: true                 # silently drop unsupported params (thinking, effort, etc.) instead of erroring
  use_responses_api: false
  # Force the Anthropic messages endpoint to translate to chat/completions
  forward_client_headers_to_llm_api: false
  # Upstream read timeout. Default 600s kills a long single generation: on a slow box a maxed
  # reasoning+content turn (8k think + 16k content) at ~44 tok/s is ~9 min, so 600s cuts it off
  # mid-stream ("Timeout on reading data from socket"). 3600s matches the rest of the timeout chain
  # (claude-shim + reasoning-normalizer UPSTREAM_TIMEOUT_MS, Claude Code API_TIMEOUT_MS).
  request_timeout: 3600
